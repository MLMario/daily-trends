[project]
name = "daily-trends"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.196.0",
    "google-auth-oauthlib>=1.4.0",
    "requests>=2.32.0",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "ctranslate2>=4.6.3",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: hits a real external API (Bright Data, etc.) — operator-gated merge check; not collected by default `pytest`",
]
